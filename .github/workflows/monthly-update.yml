name: monthly-update
# Télécharge les nouvelles données OMS / Banque mondiale, réentraîne les modèles,
# met à jour les prévisions et le tableau de bord GitHub Pages.
on:
  schedule:
    - cron: "0 6 15 * *"   # le 15 de chaque mois, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_all.py
      - run: pytest -q
      - name: Commit refreshed data and forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data models outputs docs/data
          git diff --cached --quiet || git commit -m "Mise à jour mensuelle des données et prévisions"
          git push
